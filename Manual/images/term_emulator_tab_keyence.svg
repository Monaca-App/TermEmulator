    <rect x="568" y="0" width="14" height="14" rx="2" fill="#2563EB" /><path d="M 571 7 L 574 10 L 579 3" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
    <text x="588" y="12" class="mono" font-size="10.8" fill="#0F172A">?K / ?M / ?E: 状態問合せ</text>

    <rect x="0" y="28" width="14" height="14" rx="2" fill="#2563EB" /><path d="M 3 35 L 6 38 L 11 31" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
