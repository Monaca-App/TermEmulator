    <text x="304" y="40" class="mono" font-size="10.8" fill="#0F172A">M0 / M1: PROGRAM・RUN モード切替</text>

    <rect x="568" y="28" width="14" height="14" rx="2" fill="#2563EB" /><path d="M 571 35 L 574 38 L 579 31" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
    <text x="588" y="40" class="ui" font-size="10.8" fill="#0F172A">16進番地 (W/B/VB) 対応</text>
  </g>

  <!-- ③ 上位リンク エラーコード (E0〜E6) 異常模擬 -->
  <rect x="38" y="362" width="804" height="110" rx="5" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" />
  <text x="52" y="383" class="ui" font-size="11.5" font-weight="700" fill="#92400E">③ KV 上位リンク エラー応答コード（E0〜E6）異常模擬設定</text>

  <text x="52" y="413" class="lbl">エラー応答指定:</text>
  <rect x="148" y="396" width="384" height="25" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2" rx="3" />
  <text x="158" y="413" class="ui" font-size="11" font-weight="700" fill="#0F172A">正常応答（データ読出値 / OK / CC / CF 返却） ▼</text>

  <text x="548" y="413" class="lbl">発動条件:</text>
  <rect x="612" y="396" width="212" height="25" class="inp" />
  <text x="622" y="413" class="ui" font-size="10.8" fill="#334155">常時 / N回周期 / 確率指定 ▼</text>

  <text x="52" y="445" class="sub">選択可能なエラー応答 :  E0 (デバイス番号異常) / E1 (コマンド異常) / E2 (プログラム未登録) / E4 (書込禁止) / E5 (本体エラー) / E6 (コメント無)</text>
  <text x="52" y="463" class="mono" font-size="10" fill="#64748B">実装配置: Apr/Term/ExtAnalysis/TermAnalysis.Keyence/Simulation/ucSlaveKeyence.cs (KeyenceKvSlaveTab : IProtocolSlaveTab)</text>
