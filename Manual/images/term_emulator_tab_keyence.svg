  <rect x="38" y="128" width="804" height="124" class="grp" />
  <text x="52" y="149" class="grp-hdr">① 上位リンク通信セッション（CR/CQ）・応答デリミタ・模擬 CPU 機種設定</text>

  <text x="52" y="177" class="lbl">セッション管理:</text>
  <circle cx="158" cy="173" r="6.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6" />
  <circle cx="158" cy="173" r="3.5" fill="#2563EB" />
  <text x="170" y="177" class="ui" font-size="10.8" font-weight="700" fill="#1D4ED8">Ethernet 直接受理 (CR省略可・CR-&gt;CC / CQ-&gt;CF 応答対応)</text>

  <circle cx="518" cy="173" r="6.5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4" />
  <text x="530" y="177" class="ui" font-size="10.8" fill="#334155">シリアル厳格モード (CR 受信まで E0/無応答)</text>

  <text x="52" y="210" class="lbl">応答改行コード:</text>
  <rect x="148" y="193" width="106" height="24" class="inp" />
  <text x="201" y="209" class="mono" font-size="11.2" font-weight="700" fill="#0F172A" text-anchor="middle">CRLF (\r\n)</text>

  <text x="272" y="210" class="lbl">既定データ形式:</text>
  <rect x="368" y="193" width="112" height="24" class="inp" />
  <text x="424" y="209" class="mono" font-size="11.2" font-weight="700" fill="#0F172A" text-anchor="middle">.U (16bit無符号)</text>

  <text x="498" y="210" class="lbl">機種コード (?K応答):</text>
  <rect x="622" y="193" width="124" height="24" class="inp" />
  <text x="684" y="209" class="mono" font-size="11.2" font-weight="700" fill="#0F172A" text-anchor="middle">57 (KV-8000)</text>

  <rect x="52" y="228" width="14" height="14" rx="2" fill="#2563EB" />
  <path d="M 55 235 L 58 238 L 63 231" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
  <text x="72" y="240" class="ui" font-size="10.8" fill="#1E293B">サフィックス (.U / .S / .D / .L / .H) およびワード内ビット指定 (DM10.05 等) を自動解釈</text>

  <text x="556" y="240" class="lbl">運転状態 (?M応答):</text>
  <rect x="668" y="224" width="108" height="22" class="inp" />
  <text x="722" y="239" class="mono" font-size="11" fill="#0F172A" text-anchor="middle">1 (RUNモード)</text>

