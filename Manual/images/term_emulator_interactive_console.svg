<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .lbl { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11px; font-weight: 600; fill: #1E293B; }
      .inp { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.1; rx: 2; }
      .btn { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.1; rx: 3; }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="500" fill="#F1F5F9" rx="10" />
  <text x="20" y="24" class="ui" font-size="13.5" font-weight="700" fill="#0F172A">図 3 : 手動対話・割り込み送信コンソール画面（独立モードレスフォーム : InteractiveConsoleForm）</text>

  <!-- ウィンドウ外枠 -->
  <g filter="url(#winShadow)">
    <rect x="20" y="36" width="840" height="448" rx="7" fill="#F0F0F0" stroke="#94A3B8" stroke-width="1.4" />
    <path d="M 20 43 Q 20 36 27 36 L 853 36 Q 860 36 860 43 L 860 68 L 20 68 Z" fill="#FFFFFF" />
    <line x1="20" y1="68" x2="860" y2="68" stroke="#E2E8F0" stroke-width="1" />
  </g>

  <!-- タイトルバー -->
  <rect x="32" y="44" width="16" height="16" rx="3" fill="#0F766E" />
  <text x="40" y="56" class="mono" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">TE</text>
  <text x="56" y="57" class="ui" font-size="12" font-weight="600" fill="#0F172A">手動対話・割り込み送信コンソール - Monaca TermEmulator</text>
  <g stroke="#475569" stroke-width="1.3" fill="none">
    <line x1="774" y1="53" x2="786" y2="53" />
    <rect x="802" y="47" width="11" height="10" />
    <line x1="830" y1="47" x2="841" y2="58" />
    <line x1="841" y1="47" x2="830" y2="58" />
  </g>

  <!-- 上部バー (_pnlTop): 対象チャネル / 送信宛先 / ログ消去 -->
  <rect x="21" y="69" width="838" height="36" fill="#F8FAFC" />
  <line x1="21" y1="105" x2="859" y2="105" stroke="#CBD5E1" stroke-width="1" />

  <text x="32" y="91" class="lbl">対象チャネル:</text>
  <rect x="108" y="75" width="210" height="23" class="inp" />
  <text x="116" y="91" class="ui" font-size="10.8" fill="#0F172A">E0: SCPI Virtual DMM</text>
  <text x="304" y="91" class="ui" font-size="9.5" fill="#475569">▼</text>

  <text x="334" y="91" class="lbl">送信宛先:</text>
  <rect x="392" y="75" width="206" height="23" class="inp" />
  <text x="400" y="91" class="ui" font-size="10.8" fill="#0F172A">クライアント側 (Endpoint A)</text>
  <text x="584" y="91" class="ui" font-size="9.5" fill="#475569">▼</text>

  <rect x="614" y="74" width="76" height="25" class="btn" />
  <text x="652" y="90" class="ui" font-size="10.8" font-weight="600" fill="#1E293B" text-anchor="middle">ログ消去</text>

  <!-- 中央: リアルタイム対話履歴テキストボックス (_txtLog) -->
  <rect x="21" y="106" width="838" height="256" fill="#FFFFFF" />
  <text x="32" y="128" class="mono" font-size="11" fill="#1D4ED8">[10:25:01.102] [E0] RX  &lt;- *IDN?\r\n</text>
  <text x="32" y="148" class="mono" font-size="11" fill="#0F766E">[10:25:01.108] [E0] TX  -&gt; MONACA,EMU-DMM,0001,1.0\r\n</text>
  <text x="32" y="168" class="mono" font-size="11" fill="#0F172A">[10:25:12.400] [E0] MAN -&gt; 4901234567894\r\n (F1: バーコード読取通知)</text>
  <text x="32" y="188" class="mono" font-size="11" fill="#6D28D9">[10:25:18.020] [E1] MAN -&gt; 01 03 00 00 00 02 C4 0B (HEX + Crc16Modbus 自動付与)</text>
  <text x="32" y="208" class="mono" font-size="11" fill="#0F766E">[10:25:18.025] [E1] RX  &lt;- 01 03 04 04 D2 05 DC B3 82</text>
  <text x="32" y="348" class="mono" font-size="9.6" fill="#94A3B8">※ 稼働中チャネルの送受信および手動割り込み送信履歴を Consolas 等幅ログでリアルタイム表示</text>

  <!-- 下部パネル (_pnlBottom): 3段構成 -->
  <rect x="21" y="362" width="838" height="121" fill="#F0F0F0" />
  <line x1="21" y1="362" x2="859" y2="362" stroke="#CBD5E1" stroke-width="1" />

  <!-- 下部1段目: F1〜F8 クイック送信ボタン横1列 (TableLayoutPanel 8等分) -->
  <g transform="translate(28, 369)">
    <rect x="0" y="0" width="98" height="28" rx="3" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.1" />
    <text x="49" y="18" class="ui" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="middle">F1: Barcode</text>

    <rect x="103" y="0" width="98" height="28" class="btn" />
    <text x="152" y="18" class="ui" font-size="10" font-weight="600" fill="#1E293B" text-anchor="middle">F2: 天秤計量</text>

    <rect x="206" y="0" width="98" height="28" class="btn" />
    <text x="255" y="18" class="ui" font-size="10" font-weight="600" fill="#1E293B" text-anchor="middle">F3: Modbus読出</text>

    <rect x="309" y="0" width="98" height="28" class="btn" />
    <text x="358" y="18" class="ui" font-size="10" font-weight="600" fill="#1E293B" text-anchor="middle">F4: NMEA GPS</text>

    <rect x="412" y="0" width="98" height="28" class="btn" />
    <text x="461" y="18" class="ui" font-size="10" fill="#64748B" text-anchor="middle">F5</text>

    <rect x="515" y="0" width="98" height="28" class="btn" />
    <text x="564" y="18" class="ui" font-size="10" fill="#64748B" text-anchor="middle">F6</text>

    <rect x="618" y="0" width="98" height="28" class="btn" />
    <text x="667" y="18" class="ui" font-size="10" fill="#64748B" text-anchor="middle">F7</text>

    <rect x="721" y="0" width="102" height="28" class="btn" />
    <text x="772" y="18" class="ui" font-size="10" fill="#64748B" text-anchor="middle">F8</text>
  </g>

  <!-- 下部2段目: スロット登録バー (_pnlSlotEditor) -->
  <rect x="28" y="405" width="74" height="24" class="inp" />
  <text x="38" y="421" class="mono" font-size="11" fill="#0F172A">F1</text>
  <text x="88" y="421" class="ui" font-size="9.5" fill="#475569">▼</text>

  <rect x="108" y="405" width="166" height="24" class="inp" />
  <text x="116" y="421" class="ui" font-size="10.8" fill="#0F172A">Barcode</text>

  <rect x="280" y="404" width="154" height="26" class="btn" />
  <text x="357" y="421" class="ui" font-size="10.8" font-weight="600" fill="#1E293B" text-anchor="middle">入力内容をスロット登録</text>
  <text x="448" y="421" class="ui" font-size="10" fill="#64748B">※ 下段の入力内容・HEX・チェックサムを F1〜F8 へ保存 (Setting.xml [QuickSend])</text>

  <!-- 下部3段目: アドホック送信入力バー (_pnlSendBar) -->
  <rect x="28" y="439" width="376" height="26" class="inp" />
  <text x="36" y="456" class="mono" font-size="11.5" fill="#0F172A">01 03 00 00 00 02</text>

  <rect x="414" y="445" width="14" height="14" rx="2" fill="#0078D7" />
  <path d="M 417 452 L 420 455 L 425 448" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
  <text x="433" y="456" class="ui" font-size="10.8" fill="#1E293B">HEX</text>

  <rect x="468" y="439" width="140" height="26" class="inp" />
  <text x="476" y="456" class="mono" font-size="10.8" fill="#0F766E" font-weight="700">Crc16Modbus</text>
  <text x="594" y="456" class="ui" font-size="9.5" fill="#475569">▼</text>

  <rect x="618" y="445" width="14" height="14" rx="2" fill="#0078D7" />
  <path d="M 621 452 L 624 455 L 629 448" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
  <text x="637" y="456" class="ui" font-size="10.8" fill="#1E293B">改行付与</text>

  <rect x="706" y="438" width="144" height="28" rx="4" fill="#0078D7" />
  <text x="778" y="456" class="ui" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">送信 (F9)</text>
</svg>
