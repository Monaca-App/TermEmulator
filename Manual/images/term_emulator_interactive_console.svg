<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="490" viewBox="0 0 860 490">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <linearGradient id="conTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .lbl { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11px; font-weight: 700; fill: #1E293B; }
      .grid-hdr { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1; }
      .grid-hdr-txt { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11px; font-weight: 700; fill: #1E293B; }
    </style>
  </defs>

  <rect x="0" y="0" width="860" height="490" fill="#F8FAFC" rx="10" />
  <text x="24" y="25" class="ui" font-size="14" font-weight="700" fill="#0F172A">図 3 : 対話送信・チェックサム自動計算コンソール画面（独立モードレスフォーム : InteractiveConsoleForm）</text>

  <!-- ウィンドウ枠 -->
  <g filter="url(#winShadow)">
    <rect x="24" y="38" width="812" height="428" rx="8" fill="#F3F4F6" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 24 46 Q 24 38 32 38 L 828 38 Q 836 38 836 46 L 836 70 L 24 70 Z" fill="url(#conTitle)" />
  </g>
  <text x="42" y="59" class="ui" font-size="12.5" font-weight="700" fill="#FFFFFF">対話パケット送信 ＆ クイック送信スロット (F1〜F8) - InteractiveConsoleForm</text>
  <g stroke="#E2E8F0" stroke-width="1.4" fill="none">
    <line x1="752" y1="55" x2="764" y2="55" />
    <rect x="780" y="48" width="12" height="11" />
    <line x1="808" y1="48" x2="820" y2="60" />
    <line x1="820" y1="48" x2="808" y2="60" />
  </g>

  <!-- 上段カード: アドホック手動送信 ＆ チェックサム自動付与プレビュー -->
  <rect x="36" y="80" width="788" height="128" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />

  <text x="48" y="104" class="lbl">送信先チャネル:</text>
  <rect x="140" y="88" width="234" height="25" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2" />
  <text x="150" y="105" class="ui" font-size="11" font-weight="700" fill="#1D4ED8">E1: Modbus TCP 温調計 (0.0.0.0:502) ▼</text>

  <text x="388" y="104" class="lbl">送出方向:</text>
  <rect x="448" y="88" width="164" height="25" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1" />
  <text x="458" y="105" class="ui" font-size="10.8" fill="#334155">上位クライアント側 A ▼</text>

  <text x="626" y="104" class="lbl">入力形式:</text>
  <rect x="686" y="88" width="124" height="25" rx="3" fill="#F8FAFC" stroke="#64748B" stroke-width="1.1" />
  <text x="748" y="105" class="mono" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">HEX バイト列 ▼</text>

  <text x="48" y="139" class="lbl">送信データ:</text>
  <rect x="140" y="122" width="380" height="27" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4" />
  <text x="150" y="140" class="mono" font-size="12" font-weight="700" fill="#0F172A">01 03 00 00 00 02</text>

  <text x="532" y="139" class="lbl">末尾自動計算:</text>
  <rect x="614" y="122" width="196" height="27" rx="3" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.3" />
  <text x="624" y="140" class="ui" font-size="11" font-weight="700" fill="#0F766E">CRC-16 (Modbus 0xA001) ▼</text>

  <!-- 実送出バイト列ライブプレビュー ＆ 即時送信ボタン -->
  <rect x="48" y="160" width="626" height="36" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="60" y="182" class="ui" font-size="10.5" font-weight="700" fill="#475569">送出プレビュー (8 Bytes):</text>
  <text x="206" y="183" class="mono" font-size="12" font-weight="700" fill="#0F172A">01 03 00 00 00 02</text>
  <text x="346" y="183" class="mono" font-size="12" font-weight="700" fill="#0D9488">+ C4 0B (CRC自動付与)</text>

  <rect x="684" y="159" width="126" height="38" rx="5" fill="#1D4ED8" />
  <text x="747" y="183" class="ui" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">即時送信 (F9)</text>

  <!-- 下段カード: F1〜F8 クイック送信スロット管理グリッド -->
  <text x="40" y="228" class="lbl">クイック送信スロット (F1〜F8 キーでワンタッチ送出 / Setting.xml [QuickSend] 永続化):</text>

  <g transform="translate(36, 236)">
    <rect x="0" y="0" width="788" height="186" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" />
    <rect x="0" y="0" width="54" height="26" class="grid-hdr" />
    <rect x="54" y="0" width="166" height="26" class="grid-hdr" />
    <rect x="220" y="0" width="68" height="26" class="grid-hdr" />
    <rect x="288" y="0" width="292" height="26" class="grid-hdr" />
    <rect x="580" y="0" width="124" height="26" class="grid-hdr" />
    <rect x="704" y="0" width="84" height="26" class="grid-hdr" />

    <text x="14" y="17" class="grid-hdr-txt">キー</text>
    <text x="64" y="17" class="grid-hdr-txt">スロット名称</text>
    <text x="232" y="17" class="grid-hdr-txt">形式</text>
    <text x="298" y="17" class="grid-hdr-txt">ペイロード</text>
    <text x="590" y="17" class="grid-hdr-txt">自動チェックサム</text>
    <text x="728" y="17" class="grid-hdr-txt">操作</text>

    <!-- Slot F1 -->
    <g transform="translate(0, 26)">
      <rect x="0" y="0" width="788" height="32" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1" />
      <text x="16" y="21" class="mono" font-size="11.5" font-weight="700" fill="#0F766E">F1</text>
      <text x="64" y="21" class="ui" font-size="11" font-weight="700" fill="#0F172A">バーコード読取通知</text>
      <text x="234" y="21" class="mono" font-size="11" fill="#0F766E">ASCII</text>
      <text x="298" y="21" class="mono" font-size="11" fill="#0F172A">4901234567894\r\n</text>
      <text x="590" y="21" class="mono" font-size="10.5" fill="#64748B">None</text>
      <rect x="714" y="5" width="64" height="22" rx="3" fill="#0D9488" />
      <text x="746" y="20" class="ui" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">送信</text>
    </g>

    <!-- Slot F2 -->
    <g transform="translate(0, 58)">
      <rect x="0" y="0" width="788" height="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="16" y="21" class="mono" font-size="11.5" font-weight="700" fill="#1D4ED8">F2</text>
      <text x="64" y="21" class="ui" font-size="11" font-weight="700" fill="#0F172A">電子天秤 安定計量値</text>
      <text x="234" y="21" class="mono" font-size="11" fill="#0F766E">ASCII</text>
      <text x="298" y="21" class="mono" font-size="11" fill="#0F172A">ST,+0012.34 g\r\n</text>
      <text x="590" y="21" class="mono" font-size="10.5" fill="#64748B">None</text>
      <rect x="714" y="5" width="64" height="22" rx="3" fill="#2563EB" />
      <text x="746" y="20" class="ui" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">送信</text>
    </g>

    <!-- Slot F3 -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="788" height="32" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="16" y="21" class="mono" font-size="11.5" font-weight="700" fill="#1D4ED8">F3</text>
      <text x="64" y="21" class="ui" font-size="11" font-weight="700" fill="#0F172A">Modbus 保持レジスタ読出</text>
      <text x="234" y="21" class="mono" font-size="11" fill="#6D28D9">HEX</text>
      <text x="298" y="21" class="mono" font-size="11" fill="#0F172A">01 03 00 00 00 0A</text>
      <text x="590" y="21" class="mono" font-size="10.5" fill="#0F766E" font-weight="700">Crc16Modbus</text>
      <rect x="714" y="5" width="64" height="22" rx="3" fill="#2563EB" />
      <text x="746" y="20" class="ui" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">送信</text>
    </g>

    <!-- Slot F4 -->
    <g transform="translate(0, 122)">
      <rect x="0" y="0" width="788" height="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="16" y="21" class="mono" font-size="11.5" font-weight="700" fill="#1D4ED8">F4</text>
      <text x="64" y="21" class="ui" font-size="11" font-weight="700" fill="#0F172A">NMEA 測位センテンス</text>
      <text x="234" y="21" class="mono" font-size="11" fill="#0F766E">ASCII</text>
      <text x="298" y="21" class="mono" font-size="11" fill="#0F172A">$GPGGA,123519,3540.00,N,13945.00,E,1,08</text>
      <text x="590" y="21" class="mono" font-size="10.5" fill="#0F766E" font-weight="700">XorBcc (*HH)</text>
      <rect x="714" y="5" width="64" height="22" rx="3" fill="#2563EB" />
      <text x="746" y="20" class="ui" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">送信</text>
    </g>
  </g>

  <!-- ステータスバー -->
  <rect x="25" y="434" width="810" height="31" rx="4" fill="#E2E8F0" />
  <text x="40" y="454" class="ui" font-size="11" font-weight="700" fill="#1E3A8A">直近送信: E1 へ 8 Bytes 送出完了</text>
  <line x1="274" y1="440" x2="274" y2="460" stroke="#94A3B8" stroke-width="1" />
  <text x="288" y="454" class="mono" font-size="10.2" fill="#334155">FormLifecycleHelper [Point] Key="InteractiveConsoleForm" (X,Y,W,H,DPI 独立保存)</text>
</svg>

