  <text x="733" y="95" class="btn-txt" text-anchor="middle">クリア</text>

  <rect x="772" y="77" width="110" height="28" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2" />
  <text x="827" y="95" class="ui" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">CSV / TXT保存</text>

  <!-- 上段: フレーム一覧グリッド -->
  <g transform="translate(36, 122)">
    <rect x="0" y="0" width="848" height="222" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" />
    <rect x="0" y="0" width="102" height="26" class="grid-hdr" />
    <rect x="102" y="0" width="218" height="26" class="grid-hdr" />
    <rect x="320" y="0" width="58" height="26" class="grid-hdr" />
    <rect x="378" y="0" width="470" height="26" class="grid-hdr" />

    <text x="12" y="17" class="grid-hdr-txt">時刻</text>
    <text x="112" y="17" class="grid-hdr-txt">チャネル / 方向 / 判定タグ</text>
    <text x="328" y="17" class="grid-hdr-txt">Byte</text>
    <text x="390" y="17" class="grid-hdr-txt">送受信フレーム / スレーブ応答・異常注入詳細</text>

    <!-- Row 1 -->
    <g transform="translate(0, 26)">
      <rect x="0" y="0" width="848" height="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" class="mono" font-size="11" fill="#475569">10:25:01.102</text>
      <text x="112" y="20" class="mono" font-size="11" fill="#1D4ED8" font-weight="700">COM3 -&gt; E0 [RX]</text>
      <text x="338" y="20" class="mono" font-size="11" fill="#0F172A">7</text>
      <text x="390" y="20" class="mono" font-size="11" fill="#0F172A">*IDN?\r\n  [2A 49 44 4E 3F 0D 0A]</text>
    </g>
    <!-- Row 2 -->
    <g transform="translate(0, 58)">
      <rect x="0" y="0" width="848" height="32" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1" />
      <text x="12" y="20" class="mono" font-size="11" fill="#0F766E">10:25:01.108</text>
      <text x="112" y="20" class="mono" font-size="11" fill="#0F766E" font-weight="700">E0 -&gt; COM3 [EMU-RULE]</text>
      <text x="334" y="20" class="mono" font-size="11" fill="#0F766E">29</text>
      <text x="390" y="20" class="mono" font-size="11" fill="#0F766E" font-weight="700">MONACA,EMU-DMM,0001,1.0.0\r\n (Delay=5ms)</text>
    </g>
    <!-- Row 3 (Selected) -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="848" height="32" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.3" />
      <text x="12" y="20" class="mono" font-size="11" fill="#1E3A8A" font-weight="700">10:25:02.410</text>
      <text x="112" y="20" class="mono" font-size="11" fill="#1D4ED8" font-weight="700">E2 -&gt; Client [EMU-PLC]</text>
      <text x="334" y="20" class="mono" font-size="11" fill="#1E3A8A" font-weight="700">15</text>
      <text x="390" y="20" class="mono" font-size="11" fill="#1E3A8A" font-weight="700">D0 00 00 FF FF 03 00 06 00 00 00 E8 03 01 00 (MC3E Read D100-101)</text>
    </g>
    <!-- Row 4 (Fault) -->
    <g transform="translate(0, 122)">
      <rect x="0" y="0" width="848" height="32" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
      <text x="12" y="20" class="mono" font-size="11" fill="#B91C1C">10:25:03.005</text>
      <text x="112" y="20" class="mono" font-size="11" fill="#DC2626" font-weight="700">E3 -&gt; App [EMU-FAULT]</text>
      <text x="334" y="20" class="mono" font-size="11" fill="#B91C1C">11</text>
      <text x="390" y="20" class="mono" font-size="11" fill="#B91C1C" font-weight="700">[CRC反転注入] 01 03 04 00 FA 00 64 FF FF (5回周期異常発動)</text>
    </g>
    <!-- Row 5 (Drop) -->
    <g transform="translate(0, 154)">
      <rect x="0" y="0" width="848" height="32" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
      <text x="12" y="20" class="mono" font-size="11" fill="#92400E">10:25:04.220</text>
      <text x="112" y="20" class="mono" font-size="11" fill="#B45309" font-weight="700">App -&gt; E1 [EMU-DROP]</text>
      <text x="334" y="20" class="mono" font-size="11" fill="#92400E">12</text>
      <text x="390" y="20" class="mono" font-size="11" fill="#B45309" font-weight="700">[サイレント破棄] 無応答タイムアウト検証のため要求フレームを破棄</text>
    </g>
  </g>

  <!-- 下段スプリッタペイン: 選択フレーム HEX / ASCII インスペクタ -->
  <rect x="36" y="354" width="848" height="98" rx="4" fill="#0F172A" stroke="#475569" stroke-width="1.2" />
  <text x="48" y="373" class="ui" font-size="10.5" font-weight="700" fill="#38BDF8">選択フレーム詳細ダンプ [10:25:02.410 | E2: MELSEC MC 3E Binary 応答 | 15 Bytes]</text>
  <text x="48" y="396" class="mono" font-size="11.5" fill="#E2E8F0">0000:  D0 00 00 FF FF 03 00 06  00 00 00 E8 03 01 00      |  .............</text>
  <text x="48" y="418" class="ui" font-size="10.5" fill="#A7F3D0">プロトコル解釈: サブヘッダ=D000(3E応答), 終了コード=0000(正常), D100=1000(0x03E8), D101=1(0x0001)</text>
  <text x="48" y="439" class="ui" font-size="10" fill="#94A3B8">※ サブモニターへの全画面配置や縦長リサイズに対応（SplitContainer 比率・ウィンドウ座標を自動記憶）</text>

