      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <linearGradient id="monTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .btn-box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.1; rx: 4; }
      .btn-txt { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11px; font-weight: 600; fill: #1E293B; }
      .grid-hdr { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1; }
      .grid-hdr-txt { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11px; font-weight: 700; fill: #1E293B; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="520" fill="#F8FAFC" rx="10" />
  <text x="24" y="25" class="ui" font-size="14" font-weight="700" fill="#0F172A">図 2 : リアルタイム通信・エミュレーションモニター画面（独立モードレスフォーム : TrafficMonitorForm）</text>

  <!-- ウィンドウ枠 -->
  <g filter="url(#winShadow)">
    <rect x="24" y="38" width="872" height="458" rx="8" fill="#F3F4F6" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 24 46 Q 24 38 32 38 L 888 38 Q 896 38 896 46 L 896 70 L 24 70 Z" fill="url(#monTitle)" />
  </g>

  <text x="42" y="59" class="ui" font-size="12.5" font-weight="700" fill="#FFFFFF">通信・エミュレーションモニター - TrafficMonitorForm</text>
  <g stroke="#E2E8F0" stroke-width="1.4" fill="none">
    <line x1="810" y1="55" x2="822" y2="55" />
    <rect x="838" y="48" width="12" height="11" />
    <line x1="866" y1="48" x2="878" y2="60" />
    <line x1="878" y1="48" x2="866" y2="60" />
  </g>

  <!-- フィルタ・操作ツールバー -->
  <rect x="25" y="70" width="870" height="42" fill="#FFFFFF" />
  <line x1="25" y1="112" x2="895" y2="112" stroke="#CBD5E1" stroke-width="1" />

  <text x="38" y="95" class="ui" font-size="11" font-weight="700" fill="#1E293B">チャネル:</text>
  <rect x="92" y="78" width="132" height="26" rx="3" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2" />
  <text x="102" y="95" class="ui" font-size="11" font-weight="700" fill="#0F766E">すべて (E0〜E3) ▼</text>

  <text x="236" y="95" class="ui" font-size="11" font-weight="700" fill="#1E293B">種別:</text>
  <rect x="270" y="78" width="114" height="26" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1" />
  <text x="280" y="95" class="ui" font-size="11" fill="#334155">全イベント ▼</text>

  <rect x="398" y="84" width="15" height="15" rx="2" fill="#2563EB" />
  <path d="M 401 91.5 L 404.5 95 L 410.5 87.5" stroke="#FFFFFF" stroke-width="2" fill="none" />
  <text x="419" y="96" class="ui" font-size="11" font-weight="600" fill="#1E293B">HEX 併記</text>

  <rect x="488" y="84" width="15" height="15" rx="2" fill="#2563EB" />
  <path d="M 491 91.5 L 494.5 95 L 500.5 87.5" stroke="#FFFFFF" stroke-width="2" fill="none" />
  <text x="509" y="96" class="ui" font-size="11" font-weight="600" fill="#1E293B">自動スクロール</text>

