<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="530" viewBox="0 0 940 530">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .lbl { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11px; font-weight: 600; fill: #1E293B; }
      .inp { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.1; rx: 2; }
      .btn { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.1; rx: 3; }
      .grid-hdr { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1; }
      .grid-hdr-txt { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 10.5px; font-weight: 700; fill: #1E293B; }
    </style>
  </defs>

  <rect x="0" y="0" width="940" height="530" fill="#F1F5F9" rx="10" />
  <text x="20" y="24" class="ui" font-size="13.5" font-weight="700" fill="#0F172A">図 2 : リアルタイム通信モニター画面（独立モードレスフォーム : TrafficMonitorForm）</text>

  <!-- ウィンドウ外枠 -->
  <g filter="url(#winShadow)">
    <rect x="20" y="36" width="900" height="476" rx="7" fill="#F0F0F0" stroke="#94A3B8" stroke-width="1.4" />
    <path d="M 20 43 Q 20 36 27 36 L 913 36 Q 920 36 920 43 L 920 68 L 20 68 Z" fill="#FFFFFF" />
    <line x1="20" y1="68" x2="920" y2="68" stroke="#E2E8F0" stroke-width="1" />
  </g>

  <!-- タイトルバー -->
  <rect x="32" y="44" width="16" height="16" rx="3" fill="#0F766E" />
  <text x="40" y="56" class="mono" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">TE</text>
  <text x="56" y="57" class="ui" font-size="12" font-weight="600" fill="#0F172A">リアルタイム通信モニター - Monaca TermEmulator</text>
  <g stroke="#475569" stroke-width="1.3" fill="none">
    <line x1="834" y1="53" x2="846" y2="53" />
    <rect x="862" y="47" width="11" height="10" />
    <line x1="890" y1="47" x2="901" y2="58" />
    <line x1="901" y1="47" x2="890" y2="58" />
  </g>

  <!-- 上部フィルタツールバー (_pnlToolbar) -->
  <rect x="21" y="69" width="898" height="38" fill="#F8FAFC" />
  <line x1="21" y1="107" x2="919" y2="107" stroke="#CBD5E1" stroke-width="1" />

  <text x="30" y="92" class="lbl">対象チャネル:</text>
  <rect x="104" y="76" width="132" height="23" class="inp" />
  <text x="112" y="92" class="ui" font-size="10.8" fill="#0F172A">全チャネル</text>
  <text x="222" y="92" class="ui" font-size="9.5" fill="#475569">▼</text>

  <text x="246" y="92" class="lbl">種別:</text>
  <rect x="278" y="76" width="88" height="23" class="inp" />
  <text x="286" y="92" class="ui" font-size="10.8" fill="#0F172A">すべて</text>
  <text x="352" y="92" class="ui" font-size="9.5" fill="#475569">▼</text>

  <text x="376" y="92" class="lbl">検索:</text>
  <rect x="408" y="76" width="114" height="23" class="inp" />
  <text x="416" y="92" class="mono" font-size="10.5" fill="#64748B">IDN / D100</text>

  <rect x="532" y="81" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2" />
  <text x="551" y="92" class="ui" font-size="10.8" fill="#1E293B">一時停止</text>

  <rect x="610" y="81" width="14" height="14" rx="2" fill="#0078D7" />
  <path d="M 613 88 L 616 91 L 621 84" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
  <text x="629" y="92" class="ui" font-size="10.8" fill="#1E293B">自動スクロール</text>

  <rect x="724" y="75" width="76" height="25" class="btn" />
  <text x="762" y="91" class="ui" font-size="10.8" font-weight="600" fill="#1E293B" text-anchor="middle">CSV保存</text>

  <rect x="806" y="75" width="56" height="25" class="btn" />
  <text x="834" y="91" class="ui" font-size="10.8" font-weight="600" fill="#1E293B" text-anchor="middle">消去</text>

  <!-- 上段スプリッタペイン: リアルタイム通信一覧グリッド (全7列) -->
  <g transform="translate(21, 108)">
    <rect x="0" y="0" width="898" height="248" fill="#FFFFFF" />
    <rect x="0" y="0" width="90" height="26" class="grid-hdr" />
    <rect x="90" y="0" width="44" height="26" class="grid-hdr" />
    <rect x="134" y="0" width="68" height="26" class="grid-hdr" />
    <rect x="202" y="0" width="48" height="26" class="grid-hdr" />
    <rect x="250" y="0" width="218" height="26" class="grid-hdr" />
    <rect x="468" y="0" width="166" height="26" class="grid-hdr" />
    <rect x="634" y="0" width="264" height="26" class="grid-hdr" />

    <text x="8" y="17" class="grid-hdr-txt">時刻</text>
    <text x="112" y="17" class="grid-hdr-txt" text-anchor="middle">Ch</text>
    <text x="142" y="17" class="grid-hdr-txt">方向</text>
    <text x="226" y="17" class="grid-hdr-txt" text-anchor="middle">長(B)</text>
    <text x="258" y="17" class="grid-hdr-txt">HEX ペイロード</text>
    <text x="476" y="17" class="grid-hdr-txt">ASCII プレビュー</text>
    <text x="642" y="17" class="grid-hdr-txt">一致ルール・プロトコル解析詳細</text>

    <!-- Row 1: RX -->
    <g transform="translate(0, 26)">
      <rect x="0" y="0" width="898" height="30" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="8" y="19" class="mono" font-size="10.2" fill="#334155">10:25:01.102</text>
      <text x="112" y="19" class="mono" font-size="10.2" fill="#0F172A" text-anchor="middle">E0</text>
      <text x="142" y="19" class="mono" font-size="10.2" font-weight="700" fill="#1D4ED8">RX</text>
      <text x="226" y="19" class="mono" font-size="10.2" fill="#0F172A" text-anchor="middle">7</text>
      <text x="258" y="19" class="mono" font-size="10.2" fill="#0F172A">2A 49 44 4E 3F 0D 0A</text>
      <text x="476" y="19" class="mono" font-size="10.2" fill="#0F172A">*IDN?..</text>
      <text x="642" y="19" class="ui" font-size="10.2" fill="#334155">クライアント要求受信</text>
    </g>

    <!-- Row 2: EMU -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="898" height="30" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1" />
      <text x="8" y="19" class="mono" font-size="10.2" fill="#0F766E">10:25:01.108</text>
      <text x="112" y="19" class="mono" font-size="10.2" fill="#0F766E" text-anchor="middle">E0</text>
      <text x="142" y="19" class="mono" font-size="10.2" font-weight="700" fill="#0F766E">TX/EMU</text>
      <text x="226" y="19" class="mono" font-size="10.2" fill="#0F766E" text-anchor="middle">29</text>
      <text x="258" y="19" class="mono" font-size="10.2" fill="#0F766E">4D 4F 4E 41 43 41 2C 45 ...</text>
      <text x="476" y="19" class="mono" font-size="10.2" fill="#0F766E">MONACA,EMU-DMM,0001</text>
      <text x="642" y="19" class="ui" font-size="10.2" font-weight="600" fill="#0F766E">[Rule: SCPI IDN] 遅延 5ms</text>
    </g>

    <!-- Row 3: Selected -->
    <g transform="translate(0, 86)">
      <rect x="0" y="0" width="898" height="30" fill="#0078D7" />
      <text x="8" y="19" class="mono" font-size="10.2" fill="#FFFFFF">10:25:02.410</text>
      <text x="112" y="19" class="mono" font-size="10.2" font-weight="700" fill="#FFFFFF" text-anchor="middle">E2</text>
      <text x="142" y="19" class="mono" font-size="10.2" font-weight="700" fill="#DCFCE7">TX/PLC</text>
      <text x="226" y="19" class="mono" font-size="10.2" fill="#FFFFFF" text-anchor="middle">15</text>
      <text x="258" y="19" class="mono" font-size="10.2" fill="#FFFFFF">D0 00 00 FF FF 03 00 06 00 ...</text>
      <text x="476" y="19" class="mono" font-size="10.2" fill="#FFFFFF">...............</text>
      <text x="642" y="19" class="ui" font-size="10.2" font-weight="600" fill="#FFFFFF">[MC 3E] 0401 Read D100-101 正常応答</text>
    </g>

    <!-- Row 4: FAULT -->
    <g transform="translate(0, 116)">
      <rect x="0" y="0" width="898" height="30" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
      <text x="8" y="19" class="mono" font-size="10.2" fill="#B91C1C">10:25:03.005</text>
      <text x="112" y="19" class="mono" font-size="10.2" fill="#B91C1C" text-anchor="middle">E3</text>
      <text x="142" y="19" class="mono" font-size="10.2" font-weight="700" fill="#DC2626">FAULT</text>
      <text x="226" y="19" class="mono" font-size="10.2" fill="#B91C1C" text-anchor="middle">11</text>
      <text x="258" y="19" class="mono" font-size="10.2" fill="#B91C1C">01 03 04 00 FA 00 64 FF FF</text>
      <text x="476" y="19" class="mono" font-size="10.2" fill="#B91C1C">.....d..</text>
      <text x="642" y="19" class="ui" font-size="10.2" font-weight="600" fill="#B91C1C">[異常注入] 末尾2バイト反転 (CRC破壊)</text>
    </g>

    <!-- Row 5: DROP -->
    <g transform="translate(0, 146)">
      <rect x="0" y="0" width="898" height="30" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
      <text x="8" y="19" class="mono" font-size="10.2" fill="#92400E">10:25:04.220</text>
      <text x="112" y="19" class="mono" font-size="10.2" fill="#92400E" text-anchor="middle">E1</text>
      <text x="142" y="19" class="mono" font-size="10.2" font-weight="700" fill="#B45309">DROP</text>
      <text x="226" y="19" class="mono" font-size="10.2" fill="#92400E" text-anchor="middle">12</text>
      <text x="258" y="19" class="mono" font-size="10.2" fill="#92400E">00 01 00 00 00 06 01 03 ...</text>
      <text x="476" y="19" class="mono" font-size="10.2" fill="#92400E">........</text>
      <text x="642" y="19" class="ui" font-size="10.2" font-weight="600" fill="#B45309">[EMU-DROP] サイレント破棄（無応答誘発）</text>
    </g>
  </g>

  <!-- スプリッタ境界バー -->
  <rect x="21" y="356" width="898" height="5" fill="#CBD5E1" />

  <!-- 下段スプリッタペイン: 選択フレーム詳細ダンプ (_txtDetail) -->
  <rect x="21" y="361" width="898" height="150" fill="#FFFFFF" />
  <text x="32" y="382" class="mono" font-size="10.8" font-weight="700" fill="#0F172A">Time: 10:25:02.410  |  Channel: E2  |  Direction: TX/PLC  |  Length: 15 Bytes</text>
  <text x="32" y="402" class="mono" font-size="10.8" fill="#1E293B">Summary: [MC 3E] 0401 Read D100-101 正常応答 (EndCode=0000, D100=1000, D101=1)</text>
  <line x1="32" y1="412" x2="908" y2="412" stroke="#E2E8F0" stroke-width="1" />
  <text x="32" y="432" class="mono" font-size="11" fill="#0F172A">0000:  D0 00 00 FF FF 03 00 06  00 00 00 E8 03 01 00       | ............... </text>
  <text x="32" y="498" class="mono" font-size="9.6" fill="#64748B">実装配置: tool/TermEmulator/Forms/TrafficMonitorForm.cs (SplitContainer 比率・ウィンドウ位置サイズを Setting.xml へ自動保存)</text>
</svg>
