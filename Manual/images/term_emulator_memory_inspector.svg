  <text x="294" y="409" class="badge-num">1</text>
  <rect x="312" y="395" width="496" height="28" class="callout-box" />
  <text x="322" y="414" class="callout-txt">Python / SCADA / PLCツール / Term からの書込を即時可視化・セル編集で状態変化模擬</text>

  <rect x="830" y="394" width="96" height="30" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
  <text x="878" y="414" class="ui" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">閉じる</text>
