<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <linearGradient id="memTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .badge-circle { fill: #E8590C; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif; font-size: 12px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .callout-box { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.4; rx: 6; }
      .callout-txt { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11.5px; font-weight: 700; fill: #92400E; }
      .grid-hdr { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1; }
      .grid-hdr-txt { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11.5px; font-weight: 700; fill: #1E293B; }
      .btn-box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.1; rx: 4; }
      .btn-txt { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11.5px; font-weight: 600; fill: #1E293B; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="960" height="490" fill="#F8FAFC" rx="10" />
  <text x="24" y="26" class="ui" font-size="14" font-weight="700" fill="#0F172A">図 5 : マルチベンダ対応 仮想デバイスメモリ監視・ライブ書き換え画面（独立モードレスフォーム : VirtualMemoryInspectorForm）</text>

  <!-- メインウィンドウ枠 -->
  <g filter="url(#winShadow)">
    <rect x="24" y="42" width="912" height="422" rx="8" fill="#F3F4F6" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 24 50 Q 24 42 32 42 L 928 42 Q 936 42 936 50 L 936 74 L 24 74 Z" fill="url(#memTitle)" />
  </g>
  <text x="42" y="63" class="ui" font-size="12.5" font-weight="700" fill="#FFFFFF">仮想デバイスメモリ監視・ライブ編集 - [Modbus / MELSEC / OMRON / KEYENCE 統合メモリ]</text>
  <g stroke="#E2E8F0" stroke-width="1.5">
    <line x1="908" y1="53" x2="918" y2="63" />
    <line x1="918" y1="53" x2="908" y2="63" />
  </g>

  <!-- 上部フィルタ・ジャンプ・入出力バー -->
  <rect x="34" y="84" width="892" height="42" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />

  <text x="46" y="110" class="ui" font-size="11.5" font-weight="700" fill="#1E293B">対象チャネル:</text>
  <rect x="130" y="92" width="184" height="26" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" />
  <text x="138" y="109" class="ui" font-size="11" font-weight="700" fill="#0F172A">E2: MELSEC MC 3E 仮想PLC ▼</text>

  <text x="326" y="110" class="ui" font-size="11.5" font-weight="700" fill="#1E293B">デバイス領域:</text>
  <rect x="406" y="92" width="212" height="26" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4" />
  <text x="414" y="109" class="ui" font-size="11" font-weight="700" fill="#1D4ED8">Dレジスタ / 4x HoldingReg ▼</text>

  <text x="630" y="110" class="ui" font-size="11.5" font-weight="700" fill="#1E293B">先頭番地:</text>
  <rect x="688" y="92" width="74" height="26" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
  <text x="698" y="109" class="mono" font-size="12" font-weight="700" fill="#0F172A">0100</text>

  <rect x="772" y="92" width="70" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" />
  <text x="807" y="109" class="btn-txt" text-anchor="middle">CSV読込</text>
  <rect x="848" y="92" width="70" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1" />
  <text x="883" y="109" class="btn-txt" text-anchor="middle">CSV保存</text>

  <!-- メモリ一覧グリッド -->
  <g transform="translate(34, 136)">
    <rect x="0" y="0" width="892" height="246" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" />

    <rect x="0" y="0" width="118" height="28" class="grid-hdr" />
    <rect x="118" y="0" width="112" height="28" class="grid-hdr" />
    <rect x="230" y="0" width="104" height="28" class="grid-hdr" />
    <rect x="334" y="0" width="94" height="28" class="grid-hdr" />
    <rect x="428" y="0" width="176" height="28" class="grid-hdr" />
    <rect x="604" y="0" width="128" height="28" class="grid-hdr" />
    <rect x="732" y="0" width="160" height="28" class="grid-hdr" />

    <text x="12" y="18" class="grid-hdr-txt">デバイス番地</text>
    <text x="126" y="18" class="grid-hdr-txt">他プロトコル対応</text>
    <text x="238" y="18" class="grid-hdr-txt">10進 (符号付)</text>
    <text x="344" y="18" class="grid-hdr-txt">16進 (HEX)</text>
    <text x="440" y="18" class="grid-hdr-txt">2進ビット展開 (b15..b0)</text>
    <text x="614" y="18" class="grid-hdr-txt">最終更新日時</text>
    <text x="742" y="18" class="grid-hdr-txt">メモ / 更新元クライアント</text>

    <!-- D0100 -->
    <g transform="translate(0, 28)">
      <rect x="0" y="0" width="892" height="34" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1" />
      <text x="14" y="22" class="mono" font-size="12" fill="#0F766E" font-weight="700">D00100</text>
      <text x="126" y="22" class="mono" font-size="11" fill="#334155">40101 / W0064</text>
      <rect x="234" y="5" width="94" height="24" rx="2" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.8" />
      <text x="244" y="22" class="mono" font-size="12.5" fill="#0F766E" font-weight="700">1234</text>
      <text x="344" y="22" class="mono" font-size="12" fill="#0F172A">0x04D2</text>
      <text x="438" y="22" class="mono" font-size="11" fill="#475569">0000 0100 1101 0010</text>
      <text x="614" y="22" class="mono" font-size="11" fill="#0F766E">10:25:00.000</text>
      <text x="742" y="22" class="ui" font-size="11" fill="#0F766E" font-weight="700">PV 現在温度 (手動ライブ編集)</text>
    </g>

    <!-- D0101 -->
    <g transform="translate(0, 62)">
      <rect x="0" y="0" width="892" height="34" fill="#FEF9C3" stroke="#FACC15" stroke-width="1.2" />
      <text x="14" y="22" class="mono" font-size="12" fill="#854D0E" font-weight="700">D00101</text>
      <text x="126" y="22" class="mono" font-size="11" fill="#854D0E">40102 / W0065</text>
      <text x="244" y="22" class="mono" font-size="12.5" fill="#B45309" font-weight="700">1500</text>
      <text x="344" y="22" class="mono" font-size="12" fill="#854D0E" font-weight="700">0x05DC</text>
      <text x="438" y="22" class="mono" font-size="11" fill="#854D0E">0000 0101 1101 1100</text>
      <text x="614" y="22" class="mono" font-size="11" fill="#B45309" font-weight="700">10:25:12.340 ★</text>
      <text x="742" y="22" class="ui" font-size="11" fill="#B45309" font-weight="700">&lt;- 外部アプリ 1401 書込!</text>
    </g>

    <!-- D0102 -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="892" height="34" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="14" y="22" class="mono" font-size="12" fill="#334155">D00102</text>
      <text x="126" y="22" class="mono" font-size="11" fill="#64748B">40103 / W0066</text>
      <text x="244" y="22" class="mono" font-size="12" fill="#0F172A">1</text>
      <text x="344" y="22" class="mono" font-size="12" fill="#0F172A">0x0001</text>
      <text x="438" y="22" class="mono" font-size="11" fill="#DC2626" font-weight="700">0000 0000 0000 0001</text>
      <text x="614" y="22" class="mono" font-size="11" fill="#64748B">10:24:55.120</text>
      <text x="742" y="22" class="ui" font-size="11" fill="#475569">運転中フラグ (b0=RUN)</text>
    </g>

    <!-- D0103 -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="892" height="34" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="14" y="22" class="mono" font-size="12" fill="#334155">D00103</text>
      <text x="126" y="22" class="mono" font-size="11" fill="#64748B">40104 / W0067</text>
      <text x="244" y="22" class="mono" font-size="12" fill="#64748B">0</text>
      <text x="344" y="22" class="mono" font-size="12" fill="#64748B">0x0000</text>
      <text x="438" y="22" class="mono" font-size="11" fill="#94A3B8">0000 0000 0000 0000</text>
      <text x="614" y="22" class="mono" font-size="11" fill="#94A3B8">--</text>
      <text x="742" y="22" class="ui" font-size="11" fill="#64748B">警報コード (0=正常)</text>
    </g>

    <g stroke="#E2E8F0" stroke-width="1">
      <line x1="118" y1="28" x2="118" y2="246" />
      <line x1="230" y1="28" x2="230" y2="246" />
      <line x1="334" y1="28" x2="334" y2="246" />
      <line x1="428" y1="28" x2="428" y2="246" />
      <line x1="604" y1="28" x2="604" y2="246" />
      <line x1="732" y1="28" x2="732" y2="246" />
    </g>
