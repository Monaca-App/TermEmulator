<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="525" viewBox="0 0 960 525">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .lbl { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11px; font-weight: 600; fill: #1E293B; }
      .inp { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.1; rx: 2; }
      .btn { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.1; rx: 3; }
      .grid-hdr { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1; }
      .grid-hdr-txt { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 10.5px; font-weight: 700; fill: #1E293B; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="525" fill="#F1F5F9" rx="10" />
  <text x="20" y="24" class="ui" font-size="13.5" font-weight="700" fill="#0F172A">図 5 : 統合仮想デバイスメモリ監視・ライブ編集画面（プロトコル連動領域切替・複数同時表示対応 : VirtualMemoryInspectorForm）</text>

  <!-- ウィンドウ外枠 -->
  <g filter="url(#winShadow)">
    <rect x="20" y="36" width="920" height="472" rx="7" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4" />
    <path d="M 20 43 Q 20 36 27 36 L 933 36 Q 940 36 940 43 L 940 68 L 20 68 Z" fill="#FFFFFF" />
    <line x1="20" y1="68" x2="940" y2="68" stroke="#E2E8F0" stroke-width="1" />
  </g>

  <!-- タイトルバー -->
  <rect x="32" y="44" width="16" height="16" rx="3" fill="#0F766E" />
  <text x="40" y="56" class="mono" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">TE</text>
  <text x="56" y="57" class="ui" font-size="11.5" font-weight="600" fill="#0F172A">[D0100..0163 | 全チャネル共有メモリ] 統合仮想デバイスメモリ監視・ライブ編集 - Monaca TermEmulator</text>
  <g stroke="#475569" stroke-width="1.3" fill="none">
    <line x1="854" y1="53" x2="866" y2="53" />
    <rect x="882" y="47" width="11" height="10" />
    <line x1="910" y1="47" x2="921" y2="58" />
    <line x1="921" y1="47" x2="910" y2="58" />
  </g>

  <!-- 上部操作ツールバー (_pnlToolbar : 2行整列) -->
  <rect x="21" y="69" width="918" height="68" fill="#F8FAFC" />
  <line x1="21" y1="137" x2="939" y2="137" stroke="#CBD5E1" stroke-width="1" />

  <!-- Row 0: メモリ空間 / プロトコル / デバイス領域 -->
  <text x="32" y="92" class="lbl">メモリ空間:</text>
  <rect x="96" y="76" width="158" height="23" class="inp" />
  <text x="104" y="92" class="ui" font-size="10.5" fill="#0F172A">全チャネル共有メモリ</text>
  <text x="242" y="92" class="ui" font-size="9" fill="#475569">▼</text>

  <text x="270" y="92" class="lbl">プロトコル:</text>
  <rect x="330" y="76" width="218" height="23" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2" rx="2" />
  <text x="338" y="92" class="ui" font-size="10.5" font-weight="700" fill="#1D4ED8">MELSEC MC プロトコル (QnA 3E)</text>
  <text x="536" y="92" class="ui" font-size="9" fill="#1D4ED8">▼</text>

  <text x="564" y="92" class="lbl">デバイス領域:</text>
  <rect x="638" y="76" width="176" height="23" class="inp" />
  <text x="646" y="92" class="ui" font-size="10.5" font-weight="700" fill="#0F766E">D (データレジスタ)</text>
  <text x="802" y="92" class="ui" font-size="9" fill="#475569">▼</text>

  <!-- Row 1: 先頭番地 / 点数 / CSV / 初期化 / + 別ウィンドウ -->
  <text x="32" y="123" class="lbl">先頭番地:</text>
  <rect x="96" y="107" width="70" height="23" class="inp" />
  <text x="104" y="123" class="mono" font-size="10.5" fill="#0F172A">100</text>
  <text x="152" y="122" class="ui" font-size="8.5" fill="#475569">▲▼</text>

  <text x="182" y="123" class="lbl">点数:</text>
  <rect x="214" y="107" width="60" height="23" class="inp" />
  <text x="222" y="123" class="mono" font-size="10.5" fill="#0F172A">64</text>
  <text x="260" y="122" class="ui" font-size="8.5" fill="#475569">▲▼</text>

  <rect x="294" y="106" width="68" height="25" class="btn" />
  <text x="328" y="122" class="ui" font-size="10.5" font-weight="600" fill="#1E293B" text-anchor="middle">CSV読込</text>

  <rect x="368" y="106" width="68" height="25" class="btn" />
  <text x="402" y="122" class="ui" font-size="10.5" font-weight="600" fill="#1E293B" text-anchor="middle">CSV保存</text>

  <rect x="442" y="106" width="84" height="25" class="btn" />
  <text x="484" y="122" class="ui" font-size="10.5" font-weight="600" fill="#B91C1C" text-anchor="middle">全ゼロ初期化</text>

  <rect x="536" y="106" width="96" height="25" rx="3" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2" />
  <text x="584" y="122" class="ui" font-size="10.5" font-weight="700" fill="#0F766E" text-anchor="middle">+ 別ウィンドウ</text>

  <!-- メモリ監視・編集グリッド (全8列: Dock=Fill) -->
  <g transform="translate(21, 138)">
    <rect x="0" y="0" width="918" height="369" fill="#FFFFFF" />
    <rect x="0" y="0" width="88" height="28" class="grid-hdr" />
    <rect x="88" y="0" width="84" height="28" class="grid-hdr" />
    <rect x="172" y="0" width="86" height="28" class="grid-hdr" />
    <rect x="258" y="0" width="86" height="28" class="grid-hdr" />
    <rect x="344" y="0" width="102" height="28" class="grid-hdr" />
    <rect x="446" y="0" width="158" height="28" class="grid-hdr" />
    <rect x="604" y="0" width="136" height="28" class="grid-hdr" />
    <rect x="740" y="0" width="178" height="28" class="grid-hdr" />

    <text x="8" y="18" class="grid-hdr-txt">デバイス番地</text>
    <text x="96" y="18" class="grid-hdr-txt">HEX / 接点</text>
    <text x="180" y="18" class="grid-hdr-txt">符号なし10進</text>
    <text x="266" y="18" class="grid-hdr-txt">符号付き10進</text>
    <text x="352" y="18" class="grid-hdr-txt">Float32 (2W)</text>
    <text x="454" y="18" class="grid-hdr-txt">16ビット2進展開</text>
    <text x="612" y="18" class="grid-hdr-txt">最終更新元・時刻</text>
    <text x="748" y="18" class="grid-hdr-txt">コメント・信号名称メモ</text>

    <!-- D100 -->
    <g transform="translate(0, 28)">
      <rect x="0" y="0" width="918" height="32" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1" />
      <text x="10" y="20" class="mono" font-size="11" font-weight="700" fill="#0F766E">D100</text>
      <text x="96" y="20" class="mono" font-size="11" fill="#0F172A">0x04D2</text>
      <rect x="176" y="5" width="76" height="22" rx="2" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" />
      <text x="184" y="20" class="mono" font-size="11" font-weight="700" fill="#0F766E">1234</text>
      <text x="266" y="20" class="mono" font-size="11" fill="#0F172A">1234</text>
      <text x="352" y="20" class="mono" font-size="10.5" fill="#475569">0.0000</text>
      <text x="454" y="20" class="mono" font-size="10.2" fill="#334155">0000 0100 1101 0010</text>
      <text x="612" y="20" class="mono" font-size="10" fill="#0F766E">Manual 10:25:00</text>
      <text x="748" y="20" class="ui" font-size="10.5" fill="#0F766E">PV 現在温度 (直接編集)</text>
    </g>

    <!-- D101 -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="918" height="32" fill="#FEF9C3" stroke="#FDE047" stroke-width="1" />
      <text x="10" y="20" class="mono" font-size="11" font-weight="700" fill="#854D0E">D101</text>
      <text x="96" y="20" class="mono" font-size="11" font-weight="700" fill="#854D0E">0x05DC</text>
      <text x="184" y="20" class="mono" font-size="11" font-weight="700" fill="#B45309">1500</text>
      <text x="266" y="20" class="mono" font-size="11" font-weight="700" fill="#B45309">1500</text>
      <text x="352" y="20" class="mono" font-size="10.5" fill="#854D0E">0.0000</text>
      <text x="454" y="20" class="mono" font-size="10.2" fill="#854D0E">0000 0101 1101 1100</text>
      <text x="612" y="20" class="mono" font-size="10" font-weight="700" fill="#B45309">MC3E 10:25:12</text>
      <text x="748" y="20" class="ui" font-size="10.5" font-weight="700" fill="#B45309">外部アプリ 1401 書込</text>
    </g>

    <!-- D102 -->
    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="918" height="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="10" y="20" class="mono" font-size="11" fill="#334155">D102</text>
      <text x="96" y="20" class="mono" font-size="11" fill="#0F172A">0x0001</text>
      <text x="184" y="20" class="mono" font-size="11" fill="#0F172A">1</text>
      <text x="266" y="20" class="mono" font-size="11" fill="#0F172A">1</text>
      <text x="352" y="20" class="mono" font-size="10.5" fill="#475569">1.40e-45</text>
      <text x="454" y="20" class="mono" font-size="10.2" fill="#DC2626" font-weight="700">0000 0000 0000 0001</text>
      <text x="612" y="20" class="mono" font-size="10" fill="#64748B">Modbus 10:24:55</text>
      <text x="748" y="20" class="ui" font-size="10.5" fill="#475569">運転中フラグ (b0=RUN)</text>
    </g>

    <!-- D103 -->
    <g transform="translate(0, 124)">
      <rect x="0" y="0" width="918" height="32" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="10" y="20" class="mono" font-size="11" fill="#334155">D103</text>
      <text x="96" y="20" class="mono" font-size="11" fill="#64748B">0xFFFF</text>
      <text x="184" y="20" class="mono" font-size="11" fill="#64748B">65535</text>
      <text x="266" y="20" class="mono" font-size="11" fill="#64748B">-1</text>
      <text x="352" y="20" class="mono" font-size="10.5" fill="#64748B">NaN</text>
      <text x="454" y="20" class="mono" font-size="10.2" fill="#64748B">1111 1111 1111 1111</text>
      <text x="612" y="20" class="mono" font-size="10" fill="#94A3B8">--</text>
      <text x="748" y="20" class="ui" font-size="10.5" fill="#64748B">符号付境界テスト値</text>
    </g>

    <text x="14" y="352" class="ui" font-size="10.2" fill="#64748B">※ HEX / 符号なし10進 / 符号付き10進 / Float32 (2W) の各セルは直接編集可能。ビット領域では行ダブルクリックで ON / OFF 反転。複数ウィンドウ同時起動対応。</text>
  </g>
</svg>
