<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .badge-circle { fill: #E8590C; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .btn-box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 3; }
      .btn-txt { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 10.5px; font-weight: 600; fill: #1E293B; }
      .grid-hdr { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1; }
      .grid-hdr-txt { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 10.5px; font-weight: 700; fill: #1E293B; }
    </style>
  </defs>

  <!-- 背景キャンバス -->
  <rect x="0" y="0" width="960" height="460" fill="#F8FAFC" rx="10" />
  <text x="24" y="25" class="ui" font-size="14" font-weight="700" fill="#0F172A">図 1 : メイン画面（チャネル稼働管理 ＆ 各機能独立ウィンドウ起動ハブ : EmulatorMainForm）</text>

  <!-- メインウィンドウ外枠 -->
  <g filter="url(#winShadow)">
    <rect x="20" y="38" width="920" height="402" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 20 46 Q 20 38 28 38 L 932 38 Q 940 38 940 46 L 940 70 L 20 70 Z" fill="url(#titleGrad)" />
  </g>

  <!-- タイトルバー -->
  <rect x="32" y="46" width="16" height="16" rx="3" fill="#CCFBF1" stroke="#FFFFFF" stroke-width="1.2" />
  <text x="40" y="58" class="mono" font-size="9.5" font-weight="700" fill="#0F766E" text-anchor="middle">TE</text>
  <text x="56" y="59" class="ui" font-size="12.5" font-weight="700" fill="#FFFFFF">Monaca TermEmulator - 通信機器・仮想PLCシミュレータ</text>

  <!-- 最小化・最大化・閉じるボタン -->
  <g stroke="#E2E8F0" stroke-width="1.4" fill="none">
    <line x1="854" y1="55" x2="866" y2="55" />
    <rect x="882" y="48" width="12" height="11" />
    <line x1="910" y1="48" x2="922" y2="60" />
    <line x1="922" y1="48" x2="910" y2="60" />
  </g>

  <!-- 標準メニューバー -->
  <rect x="21" y="70" width="918" height="25" fill="#F8FAFC" />
  <line x1="21" y1="95" x2="939" y2="95" stroke="#E2E8F0" stroke-width="1" />
  <text x="34" y="87" class="ui" font-size="11" fill="#1E293B">ファイル(F)</text>
  <text x="104" y="87" class="ui" font-size="11" fill="#1E293B">チャネル(C)</text>
  <text x="176" y="87" class="ui" font-size="11" fill="#1E293B">ツール(T)</text>
  <text x="240" y="87" class="ui" font-size="11" fill="#1E293B">設定(S)</text>
  <text x="296" y="87" class="ui" font-size="11" fill="#1E293B">ヘルプ(H)</text>

  <!-- メインツールバー: [編集グループ] | [稼働制御グループ] | [独立ウィンドウ起動グループ] -->
  <rect x="21" y="95" width="918" height="36" fill="#FFFFFF" />
  <line x1="21" y1="131" x2="939" y2="131" stroke="#CBD5E1" stroke-width="1" />

  <!-- ① チャネル編集・プリセットグループ -->
  <circle cx="34" cy="113" r="8.5" class="badge-circle" />
  <text x="34" y="113" class="badge-num">1</text>

  <rect x="48" y="101" width="54" height="24" class="btn-box" />
  <text x="75" y="117" class="btn-txt" text-anchor="middle">+ 追加</text>

  <rect x="106" y="101" width="76" height="24" rx="3" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1" />
  <text x="144" y="117" class="ui" font-size="10.5" font-weight="700" fill="#92400E" text-anchor="middle">プリセット ▼</text>

  <rect x="186" y="101" width="60" height="24" class="btn-box" />
  <text x="216" y="117" class="btn-txt" text-anchor="middle">設定編集</text>

  <rect x="250" y="101" width="44" height="24" class="btn-box" />
  <text x="272" y="117" class="btn-txt" text-anchor="middle">削除</text>

  <line x1="302" y1="102" x2="302" y2="124" stroke="#CBD5E1" stroke-width="1.2" />

  <!-- ② 個別・一括稼働制御グループ -->
  <circle cx="315" cy="113" r="8.5" class="badge-circle" />
  <text x="315" y="113" class="badge-num">2</text>

  <rect x="329" y="101" width="46" height="24" rx="3" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.1" />
  <text x="352" y="117" class="ui" font-size="10.5" font-weight="700" fill="#0F766E" text-anchor="middle">開始</text>

  <rect x="379" y="101" width="46" height="24" class="btn-box" />
  <text x="402" y="117" class="btn-txt" text-anchor="middle">停止</text>

  <rect x="429" y="101" width="56" height="24" rx="3" fill="#0D9488" stroke="#0F766E" stroke-width="1" />
  <text x="457" y="117" class="ui" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">全開始</text>

  <rect x="489" y="101" width="56" height="24" class="btn-box" />
  <text x="517" y="117" class="btn-txt" text-anchor="middle">全停止</text>

  <line x1="553" y1="102" x2="553" y2="124" stroke="#94A3B8" stroke-width="1.3" />

  <!-- ③ 独立機能ウィンドウ起動ランチャー群 -->
  <circle cx="566" cy="113" r="8.5" class="badge-circle" />
  <text x="566" y="113" class="badge-num">3</text>

  <rect x="580" y="101" width="84" height="24" rx="3" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2" />
  <text x="622" y="117" class="ui" font-size="10.5" font-weight="700" fill="#0F766E" text-anchor="middle">通信モニター</text>

  <rect x="668" y="101" width="90" height="24" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2" />
  <text x="713" y="117" class="ui" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">対話コンソール</text>

  <rect x="762" y="101" width="76" height="24" rx="3" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2" />
  <text x="800" y="117" class="ui" font-size="10.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">仮想メモリ</text>

  <rect x="842" y="101" width="78" height="24" rx="3" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2" />
  <text x="881" y="117" class="ui" font-size="10.5" font-weight="700" fill="#5B21B6" text-anchor="middle">自動モック</text>

  <!-- チャネル一覧グリッド (全9列: 有効 / ID / チャネル名 / 動作モード / 接続先・待受設定 / プロトコル / 稼働状態 / 受信・送信(B) / 応答数) -->
  <g transform="translate(21, 131)">
    <rect x="0" y="0" width="918" height="278" fill="#FFFFFF" />
    <!-- ヘッダ -->
    <rect x="0" y="0" width="46" height="28" class="grid-hdr" />
    <rect x="46" y="0" width="40" height="28" class="grid-hdr" />
    <rect x="86" y="0" width="146" height="28" class="grid-hdr" />
    <rect x="232" y="0" width="136" height="28" class="grid-hdr" />
    <rect x="368" y="0" width="164" height="28" class="grid-hdr" />
    <rect x="532" y="0" width="84" height="28" class="grid-hdr" />
    <rect x="616" y="0" width="88" height="28" class="grid-hdr" />
    <rect x="704" y="0" width="132" height="28" class="grid-hdr" />
    <rect x="836" y="0" width="82" height="28" class="grid-hdr" />

    <text x="23" y="18" class="grid-hdr-txt" text-anchor="middle">有効</text>
    <text x="66" y="18" class="grid-hdr-txt" text-anchor="middle">ID</text>
    <text x="94" y="18" class="grid-hdr-txt">チャネル名</text>
    <text x="240" y="18" class="grid-hdr-txt">動作モード</text>
    <text x="376" y="18" class="grid-hdr-txt">接続先・待受設定</text>
    <text x="540" y="18" class="grid-hdr-txt">プロトコル</text>
    <text x="624" y="18" class="grid-hdr-txt">稼働状態</text>
    <text x="712" y="18" class="grid-hdr-txt">受信 / 送信 (B)</text>
    <text x="844" y="18" class="grid-hdr-txt">応答数</text>

    <!-- Row 1 (選択行イメージ: E0) -->
    <g transform="translate(0, 28)">
      <rect x="0" y="0" width="918" height="32" fill="#0078D7" />
      <rect x="16" y="9" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="1" />
      <path d="M 19 16 L 22 19 L 27 12" stroke="#0078D7" stroke-width="2" fill="none" />
      <text x="66" y="20" class="mono" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">E0</text>
      <text x="94" y="20" class="ui" font-size="11" font-weight="700" fill="#FFFFFF">SCPI Virtual DMM</text>
      <text x="240" y="20" class="ui" font-size="10.5" fill="#FFFFFF">TCP サーバー仮想機器</text>
      <text x="376" y="20" class="mono" font-size="10.5" fill="#FFFFFF">TCP 127.0.0.1:5025</text>
      <text x="540" y="20" class="mono" font-size="10.5" fill="#FFFFFF">-</text>
      <text x="624" y="20" class="ui" font-size="10.5" font-weight="700" fill="#DCFCE7">稼働中</text>
      <text x="712" y="20" class="mono" font-size="10.5" fill="#FFFFFF">1,420 / 3,840</text>
      <text x="844" y="20" class="mono" font-size="10.5" fill="#FFFFFF">142</text>
    </g>

    <!-- Row 2 (E1: Modbus) -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="918" height="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <rect x="16" y="9" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2" />
      <path d="M 19 16 L 22 19 L 27 12" stroke="#0F766E" stroke-width="2" fill="none" />
      <text x="66" y="20" class="mono" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">E1</text>
      <text x="94" y="20" class="ui" font-size="11" fill="#0F172A">Modbus 温調計スレーブ</text>
      <text x="240" y="20" class="ui" font-size="10.5" fill="#334155">TCP サーバー仮想機器</text>
      <text x="376" y="20" class="mono" font-size="10.5" fill="#0F172A">TCP 0.0.0.0:502</text>
      <text x="540" y="20" class="mono" font-size="10.5" font-weight="700" fill="#1D4ED8">Modbus</text>
      <text x="624" y="20" class="ui" font-size="10.5" font-weight="700" fill="#15803D">稼働中</text>
      <text x="712" y="20" class="mono" font-size="10.5" fill="#334155">10,200 / 12,750</text>
      <text x="844" y="20" class="mono" font-size="10.5" fill="#334155">850</text>
    </g>

    <!-- Row 3 (E2: MC 3E) -->
    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="918" height="32" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <rect x="16" y="9" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2" />
      <path d="M 19 16 L 22 19 L 27 12" stroke="#0F766E" stroke-width="2" fill="none" />
      <text x="66" y="20" class="mono" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">E2</text>
      <text x="94" y="20" class="ui" font-size="11" fill="#0F172A">MELSEC 3E 仮想PLC</text>
      <text x="240" y="20" class="ui" font-size="10.5" fill="#334155">TCP サーバー仮想機器</text>
      <text x="376" y="20" class="mono" font-size="10.5" fill="#0F172A">TCP 0.0.0.0:5000</text>
      <text x="540" y="20" class="mono" font-size="10.5" font-weight="700" fill="#1D4ED8">MelsecMc3E</text>
      <text x="624" y="20" class="ui" font-size="10.5" font-weight="700" fill="#15803D">稼働中</text>
      <text x="712" y="20" class="mono" font-size="10.5" fill="#334155">1,344 / 1,600</text>
      <text x="844" y="20" class="mono" font-size="10.5" fill="#334155">64</text>
    </g>

    <!-- Row 4 (E3: Proxy) -->
    <g transform="translate(0, 124)">
      <rect x="0" y="0" width="918" height="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <rect x="16" y="9" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2" />
      <text x="66" y="20" class="mono" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">E3</text>
      <text x="94" y="20" class="ui" font-size="11" fill="#0F172A">実機PLC 透過Proxy</text>
      <text x="240" y="20" class="ui" font-size="10.5" fill="#6D28D9">TCP 透過プロキシ</text>
      <text x="376" y="20" class="mono" font-size="10" fill="#6D28D9">15000 -&gt; 192.168.1.10:5000</text>
      <text x="540" y="20" class="mono" font-size="10.5" fill="#64748B">-</text>
      <text x="624" y="20" class="ui" font-size="10.5" fill="#64748B">停止中</text>
      <text x="712" y="20" class="mono" font-size="10.5" fill="#334155">0 / 0</text>
      <text x="844" y="20" class="mono" font-size="10.5" fill="#334155">0</text>
    </g>

    <!-- 余白ガイド -->
    <text x="16" y="256" class="ui" font-size="10.5" fill="#64748B">※ 行ダブルクリックで [チャネル詳細設定] を開く ／ 「有効」チェックは起動時自動開始フラグ（個別「開始」時は自動 ON、「全開始」時は変更せず一括稼働）</text>
  </g>

  <!-- ステータスバー (実画面と同一フォーマット) -->
  <rect x="21" y="409" width="918" height="30" fill="#F1F5F9" />
  <line x1="21" y1="409" x2="939" y2="409" stroke="#CBD5E1" stroke-width="1" />
  <text x="32" y="428" class="ui" font-size="10.5" fill="#0F172A">稼働: 3 / 4 チャネル | 累計TX: 18,190 B | 累計RX: 12,964 B | 有効拡張: Modbus, MELSEC, MC 3E, Telnet, OMRON, KEYENCE | ライセンス認証済 (monaca.app.store)</text>
</svg>
