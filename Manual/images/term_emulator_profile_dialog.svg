  <rect x="344" y="234" width="120" height="23" class="inp" />
  <text x="352" y="250" class="mono" font-size="11" fill="#0F172A">5025</text>
  <text x="448" y="249" class="ui" font-size="8.5" fill="#475569">▲▼</text>

  <text x="556" y="250" class="lbl">パイプ名:</text>
  <rect x="564" y="234" width="180" height="23" class="inp-dis" />
  <text x="572" y="250" class="mono" font-size="11" fill="#94A3B8">TermEmulatorPipe0</text>

