  <text x="106" y="121" class="ui" font-size="11" font-weight="600" fill="#1D4ED8">なし (汎用応答ルールのみ)</text>
  <text x="309" y="121" class="ui" font-size="10" fill="#1D4ED8">▼</text>

  <rect x="352" y="110" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2" />
  <text x="372" y="121" class="ui" font-size="11" fill="#0F172A">自動開始</text>

