  <text x="138" y="318" class="mono" font-size="11" fill="#94A3B8">127.0.0.1</text>

  <text x="378" y="318" class="lbl-dis">転送先ポート:</text>
  <rect x="386" y="302" width="120" height="23" class="inp-dis" />
  <text x="394" y="318" class="mono" font-size="11" fill="#94A3B8">5021</text>

