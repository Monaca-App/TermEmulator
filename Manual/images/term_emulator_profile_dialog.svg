  <text x="276" y="488" class="ui" font-size="9" fill="#475569">▼</text>

  <!-- 下部ボタンバー -->
  <text x="32" y="556" class="mono" font-size="9.8" fill="#475569">TableLayoutPanel 固定グリッド整列（高 DPI / ウィンドウリサイズ時もラベルと入力欄が分離しません）</text>
  <rect x="676" y="536" width="92" height="28" rx="4" fill="#FFFFFF" stroke="#0078D7" stroke-width="1.5" />
  <text x="722" y="554" class="ui" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">OK</text>
  <rect x="776" y="536" width="92" height="28" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.1" />
  <text x="822" y="554" class="ui" font-size="11.5" fill="#1E293B" text-anchor="middle">キャンセル</text>
