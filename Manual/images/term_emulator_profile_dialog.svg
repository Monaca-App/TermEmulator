  <text x="84.5" y="128" class="ui" font-size="10.8" font-weight="700" fill="#0F172A" text-anchor="middle">接続・フレーミング</text>

  <path d="M 143 136 L 143 116 Q 143 113 146 113 L 236 113 Q 239 113 239 116 L 239 136 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
  <text x="191" y="128" class="ui" font-size="10.5" fill="#334155" text-anchor="middle">自動応答ルール</text>

