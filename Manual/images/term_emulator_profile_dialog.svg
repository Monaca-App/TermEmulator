  <text x="352" y="216" class="mono" font-size="11" fill="#94A3B8">One</text>
  <text x="450" y="216" class="ui" font-size="9" fill="#94A3B8">▼</text>

  <text x="556" y="216" class="lbl">制御:</text>
  <rect x="564" y="200" width="120" height="23" class="inp-dis" />
  <text x="572" y="216" class="mono" font-size="11" fill="#94A3B8">None</text>
