  <line x1="429" y1="66" x2="523" y2="66" stroke="#F8FAFC" stroke-width="2.5" />

  <!-- 上部有効化バー -->
  <rect x="38" y="80" width="804" height="38" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" />
  <rect x="52" y="91" width="16" height="16" rx="3" fill="#2563EB" />
