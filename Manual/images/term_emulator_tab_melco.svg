<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510">
  <defs>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.14" />
    </filter>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .lbl { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11px; font-weight: 700; fill: #1E293B; }
      .sub { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 10.5px; fill: #475569; }
      .inp { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.2; rx: 3; }
      .grp { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.1; rx: 5; }
      .grp-hdr { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11.5px; font-weight: 700; fill: #1E3A8A; }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="510" fill="#F8FAFC" rx="10" />
  <text x="24" y="25" class="ui" font-size="13.5" font-weight="700" fill="#0F172A">図 4-2 : [MELSEC] 計算機リンク仮想 PLC タブ画面（TermAnalysis.Melco.dll 内蔵 : ucSlaveMelco）</text>

  <!-- ライセンスバッジ -->
  <rect x="644" y="9" width="212" height="22" rx="11" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1" />
  <text x="750" y="24" class="ui" font-size="10.2" font-weight="700" fill="#1D4ED8" text-anchor="middle">✓ TermAddIn_Melco.License 有効</text>

  <!-- タブストリップ (基本4タブ + 選択中の MELSEC タブのみ表示) -->
  <path d="M 28 66 L 28 44 Q 28 40 32 40 L 130 40 Q 134 40 134 44 L 134 66 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
  <text x="81" y="57" class="ui" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">接続・フレーミング</text>

  <path d="M 138 66 L 138 44 Q 138 40 142 40 L 232 40 Q 236 40 236 44 L 236 66 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
  <text x="187" y="57" class="ui" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">自動応答ルール</text>

  <path d="M 240 66 L 240 44 Q 240 40 244 40 L 302 40 Q 306 40 306 44 L 306 66 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
  <text x="273" y="57" class="ui" font-size="10.2" font-weight="600" fill="#475569" text-anchor="middle">異常注入</text>

  <path d="M 310 66 L 310 44 Q 310 40 314 40 L 366 40 Q 370 40 370 44 L 370 66 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
  <text x="340" y="57" class="ui" font-size="10.2" font-weight="600" fill="#475569" text-anchor="middle">定周期</text>

  <!-- アクティブタブ: [MELSEC] -->
  <path d="M 374 67 L 374 39 Q 374 35 378 35 L 468 35 Q 472 35 472 39 L 472 67 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8" />
  <text x="423" y="56" class="ui" font-size="11.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">MELSEC</text>
  <text x="484" y="56" class="sub" font-size="9.8">※ ヘッダ「プロトコル: MELSEC」選択時のみ表示</text>

  <!-- ucSlaveMelco 本体コンテナ -->
  <g filter="url(#cardShadow)">
    <rect x="24" y="66" width="832" height="420" rx="5" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5" />
  </g>
  <line x1="375" y1="66" x2="471" y2="66" stroke="#F8FAFC" stroke-width="2.5" />

  <!-- 上部タイトルバー -->
  <rect x="38" y="80" width="804" height="38" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" />
  <text x="54" y="104" class="ui" font-size="11.5" font-weight="700" fill="#1E3A8A">三菱電機 MELSEC 計算機リンク (形式1〜形式5)</text>

  <rect x="612" y="85" width="218" height="28" rx="4" fill="#1D4ED8" />
  <text x="721" y="103" class="ui" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">仮想メモリ監視を開く (D/M/X/Y/W)</text>

  <!-- ① 専用プロトコル形式・局番・PC番号設定 -->
  <rect x="38" y="128" width="804" height="126" class="grp" />
  <text x="52" y="149" class="grp-hdr">① 専用プロトコル形式（形式1〜形式5）・局番・サムチェック設定</text>

  <text x="52" y="179" class="lbl">プロトコル形式:</text>
  <rect x="154" y="162" width="308" height="25" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2" rx="3" />
  <text x="164" y="179" class="ui" font-size="11" font-weight="700" fill="#1D4ED8">自動判別 (ASCII ENQ: 形式1〜4 / Binary DLE: 形式5) ▼</text>

  <text x="480" y="179" class="lbl">局番号 (Station):</text>
  <rect x="586" y="162" width="58" height="25" class="inp" />
  <text x="615" y="179" class="mono" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">00</text>
  <text x="650" y="179" class="sub">(0〜31)</text>

  <text x="706" y="179" class="lbl">PC番号:</text>
  <rect x="758" y="162" width="66" height="25" class="inp" />
  <text x="791" y="179" class="mono" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">FF</text>

  <rect x="52" y="201" width="14" height="14" rx="2" fill="#2563EB" />
  <path d="M 55 208 L 58 211 L 63 204" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
  <text x="72" y="213" class="ui" font-size="10.8" fill="#1E293B">サムチェック検証・応答末尾付与を有効化（不一致フレームは NAK 応答）</text>

  <rect x="478" y="201" width="14" height="14" rx="2" fill="#2563EB" />
  <path d="M 481 208 L 484 211 L 489 204" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
  <text x="498" y="213" class="ui" font-size="10.8" fill="#1E293B">形式4 選択時は応答末尾へ CR+LF (0x0D 0x0A) を自動付加</text>

  <rect x="52" y="229" width="14" height="14" rx="2" fill="#2563EB" />
  <path d="M 55 236 L 58 239 L 63 232" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
  <text x="72" y="241" class="ui" font-size="10.8" fill="#1E293B">伝送待ち時間キャラクタ (0H〜FH : 0〜150ms) を解釈して応答ディレイに反映</text>

  <!-- ② 対応コマンド ＆ X/Y アドレス基数設定 -->
  <rect x="38" y="264" width="804" height="88" class="grp" />
  <text x="52" y="285" class="grp-hdr">② 対応コマンド・デバイス番地基数設定（MelsecDeviceParser 共用）</text>

  <rect x="52" y="298" width="14" height="14" rx="2" fill="#2563EB" /><path d="M 55 305 L 58 308 L 63 301" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
  <text x="72" y="310" class="mono" font-size="10.8" fill="#0F172A">一括読出 (BR / WR / JR / QR)</text>

  <rect x="292" y="298" width="14" height="14" rx="2" fill="#2563EB" /><path d="M 295 305 L 298 308 L 303 301" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
  <text x="312" y="310" class="mono" font-size="10.8" fill="#0F172A">一括書込 (BW / WW / JW / QW)</text>

  <rect x="542" y="298" width="14" height="14" rx="2" fill="#2563EB" /><path d="M 545 305 L 548 308 L 553 301" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
  <text x="562" y="310" class="mono" font-size="10.8" fill="#0F172A">折返しテスト (BT)</text>

  <text x="52" y="338" class="lbl">X / Y デバイス番地解釈:</text>
  <rect x="196" y="321" width="248" height="23" class="inp" />
  <text x="206" y="337" class="ui" font-size="10.5" fill="#0F172A">16進表記 (Q/L/iQ-R シリーズ標準) ▼</text>
  <text x="458" y="338" class="sub">対応デバイス: X, Y, M, L, B, D, W, R, TN, CN</text>

  <!-- ③ NAK / 異常終了コード模擬 -->
  <rect x="38" y="362" width="804" height="110" rx="5" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" />
  <text x="52" y="383" class="ui" font-size="11.5" font-weight="700" fill="#92400E">③ 計算機リンク NAK 応答・エラーコード模擬設定</text>

  <text x="52" y="413" class="lbl">応答モード:</text>
  <rect x="134" y="396" width="376" height="25" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2" rx="3" />
  <text x="144" y="413" class="ui" font-size="11" font-weight="700" fill="#0F172A">正常応答（読出: STX...ETX / 書込: ACK 返却） ▼</text>

  <text x="528" y="413" class="lbl">NAK エラーコード:</text>
  <rect x="642" y="396" width="68" height="25" class="inp" />
  <text x="676" y="413" class="mono" font-size="11.5" font-weight="700" fill="#B45309" text-anchor="middle">02H</text>
  <text x="718" y="413" class="sub">(HEX 2桁)</text>

  <text x="52" y="445" class="sub">代表的な NAK エラーコード :  02H (サムチェック異常) / 03H (プロトコル異常) / 06H (キャラクタ部異常) / 55H (RUN中書込禁止) / 58H (範囲外)</text>
  <text x="52" y="463" class="mono" font-size="10" fill="#64748B">実装配置: Apr/Term/ExtAnalysis/TermAnalysis.Melco/Simulation/ucSlaveMelco.cs (MelsecLinkSlaveTab : IProtocolSlaveTab)</text>
</svg>

